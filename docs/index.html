<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black", not "black-translucent": with translucent, iOS home-screen apps get a window one status
       bar shorter than the screen, pinned to the top, leaving a black strip at the bottom. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CJK Reader">
  <meta name="description" content="Point your camera at Chinese, Japanese or Korean text to see how to read it.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>CJK Reader</title>
</head>
<body data-mode="idle">
  <main id="view">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="still" hidden></canvas>
    <canvas id="overlay"></canvas>
  </main>

  <header>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="zh" lang="zh">中文</button>
      <button data-lang="ja" lang="ja">日本語</button>
      <button data-lang="ko" lang="ko">한국어</button>
    </div>
    <div id="status" aria-live="polite"></div>
    <pre id="debug" hidden></pre>
    <div id="devbar" hidden></div>
  </header>

  <section id="sheet" hidden><ol id="lines"></ol></section>

  <div id="zoombar">
    <output id="zoomval" for="zoom">1.0×</output>
    <input id="zoom" type="range" min="1" max="3" step="0.05" value="1" aria-label="Zoom">
    <div class="ticks"><button data-zoom="1">1×</button><button data-zoom="2">2×</button><button data-zoom="3">3×</button></div>
  </div>

  <footer>
    <label class="btn icon" aria-label="Open photo" title="Open photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10.5a3 3 0 0 1 3 3V17"/><rect x="3.5" y="7" width="13.5" height="13.5" rx="2.5"/><circle cx="8.3" cy="11.8" r="1.5"/><path d="M17 17.5l-4-4-8.5 7"/></svg>
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <button id="shutter" class="shutter" aria-label="Freeze"></button>
    <button id="list" class="btn icon" aria-label="List of lines" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>
    </button>
  </footer>

  <div id="start">
    <h1>CJK Reader</h1>
    <p>Point the camera at Chinese, Japanese or Korean text to see how to read it.</p>
    <button id="go">Start camera</button>
    <p id="start-msg"></p>
    <p id="progress"></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
